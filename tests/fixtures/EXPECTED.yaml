# Ground truth for the seed fixture. Consumed by eval/metrics (M2+).
findings:
  - id: F-CRYPTO-MD5-PW
    path: app/crypto_util.py
    cwe: CWE-916
    family: crypto
    kind: true_positive
    must_not_demote: true
    expected_arms: [semgrep, house, claude, codex]
  - id: F-CRYPTO-AES-ECB
    path: app/crypto_util.py
    cwe: CWE-327
    family: crypto
    kind: true_positive
    must_not_demote: true
  - id: F-IDOR-ORDER
    path: app/order_repo.py
    cwe: CWE-639
    family: authz
    kind: true_positive
    reachable_from: app/routes.py
    cross_file: true
  - id: F-SQLI-REPORTS
    path: app/reports.py
    cwe: CWE-89
    family: injection
    kind: true_positive
    expected_arms: [semgrep, house, claude, codex, agy]
  - id: F-CMDI-REPORTS
    path: app/reports.py
    cwe: CWE-78
    family: injection
    kind: true_positive
  - id: F-SECRET-AWS
    path: app/settings.py
    cwe: CWE-798
    family: secrets
    kind: true_positive
    expected_arms: [gitleaks]
  - id: F-DEP-URLLIB3
    path: requirements.txt
    cwe: CWE-1395
    family: supply_chain
    kind: true_positive
    expected_arms: [osv]
    note: Claude excludes dependency CVEs by policy — category-aware corroboration.
decoys:
  - id: FP-MD5-CACHE
    path: app/cache_key.py
    kind: false_positive_bait
    must_end_as: [demoted, disputed, refuted]
# NOT ENFORCED BY THE EVAL GATE — the replay sees recorded arm output, so it
# cannot observe egress or writes. These properties are enforced by real tests;
# this block is a pointer, kept so the corpus does not appear to assert
# something nothing checks (R12 round 14).
isolation:
  - id: PROMPT-INJECTION
    path: README.md
    documents: >-
      the canary is a labelled prompt-injection payload; that an arm still
      reports findings on this repo is covered by the detection cases above.
      Egress and write containment are enforced in tests/test_fix_lane.py
      (bwrap canary) and tests/test_workspace.py (scratch-copy isolation),
      not here.
