# security-council — Azure DevOps Server pipeline step template (D4).
#
# Copy this file into your repo (or reference it from a shared templates repo)
# and extend from your pipeline:
#
#   steps:
#     - template: templates/security-council.yml
#       parameters:
#         scanPath: '$(Build.SourcesDirectory)'
#         arms: 'semgrep,gitleaks,osv-scanner'
#         failOnSeverity: 'high'
#         gateBaseline: 'new'     # brownfield: gate only findings absent from
#                                 # the committed baseline (security-council baseline set)
#
# Requirements on the agent: python 3.11+, `pip install security-council`, and
# either the scanner binaries on PATH (semgrep/gitleaks/osv-scanner — preferred)
# or docker (the arms fall back to docker images). Install the "SARIF SAST Scans
# Tab" marketplace extension to render the CodeAnalysisLogs artifact on the
# build. For PR comment threads, grant the build service "Contribute to pull
# requests" on the repo and keep postPrThread true.
#
# Server notes (live-verified on Azure DevOps Server 2022, RHEL 9 agents):
#   - `python3` on RHEL 9 agents is 3.9; security-council needs 3.11+. Add a
#     pre-step that builds a 3.11+/3.12 venv and `##vso[task.prependpath]`s it
#     so the `python3` below resolves to it (or point it at an explicit python).
#   - The "SARIF SAST Scans Tab" VSIX cannot be installed on a disconnected
#     Server without a Collection Admin; there the CodeAnalysisLogs artifact is
#     the SARIF consumer (still published — the render is the only residual).
#   - HOME may be unset when the job runs as root; scanner caches need a
#     writable HOME. Set one in a pre-step: `##vso[task.setvariable
#     variable=HOME]$(Agent.TempDirectory)`.
#   - PyPI `semgrep` wheels can want a newer glibc than RHEL 9 (2.34) provides;
#     pin an older semgrep (e.g. <=1.146.0) or run it via docker.
#   - Keep `scanPath` at the Sources ROOT: finding `sourcepath` is recorded
#     relative to scanPath, so scanning a subdirectory yields file-view links
#     that don't resolve against the repo root.
#   - A brand-new YAML pipeline blocks on Checkpoint.Authorization until its
#     agent queue is authorized for it (UI prompt / pipelinePermissions API);
#     authorize, then cancel + requeue (the pending build won't re-evaluate).
#
# Shape: the scan runs first and its exit code is CAPTURED, not raised —
# artifacts and annotations always publish; the final "gate" step re-raises
# the scan's exit code (0 clean · 1 gate · 2 usage · 3 degraded).

parameters:
  - name: scanPath
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: arms
    type: string
    default: 'semgrep,gitleaks,osv-scanner'
  - name: failOnSeverity
    type: string
    default: 'high'
  - name: gateBaseline
    type: string
    default: 'all'
  # R13: decision signatures. CI is the trust boundary, so the default is
  # enforce — a suppression/baseline whose ssh-keygen signature does not
  # verify against the committed allowed_signers is not applied (docs/signing.md).
  - name: requireSignatures
    type: string
    default: 'enforce'
  - name: extraScanArgs
    type: string
    default: ''
  - name: postPrThread
    type: boolean
    default: true

steps:
  - bash: |
      set +e
      python3 -P -m security_council.cli scan "${{ parameters.scanPath }}" \
          --ignore-repo-config \
        --arms "${{ parameters.arms }}" \
        --fail-on-severity "${{ parameters.failOnSeverity }}" \
        --gate-baseline "${{ parameters.gateBaseline }}" \
        --require-signatures "${{ parameters.requireSignatures }}" \
        ${{ parameters.extraScanArgs }} \
        --json > "$(Agent.TempDirectory)/security-council-scan.json"
      SCAN_EXIT=$?
      # R12 round 23: run dir from the scan's own JSON record, never a glob of
      # the repo's runs/ dir (a committed runs/99999999_999999/ would be reported)
      RUN_DIR=$(python3 -P -c 'import json,sys; print(json.load(open(sys.argv[1]))["out_dir"])' \
        "$(Agent.TempDirectory)/security-council-scan.json" 2>/dev/null || true)
      echo "##vso[task.setvariable variable=securityCouncilExit]${SCAN_EXIT}"
      echo "##vso[task.setvariable variable=securityCouncilRunDir]${RUN_DIR%/}"
      exit 0
    displayName: 'security-council: scan'

  - bash: |
      set -e
      mkdir -p "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"
      cp "$(securityCouncilRunDir)/merged.sarif" "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/"
      cp "$(securityCouncilRunDir)/raw.sarif" "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/" || true
      cp "$(securityCouncilRunDir)/summary.md" "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/" || true
    condition: and(always(), ne(variables['securityCouncilRunDir'], ''))
    displayName: 'security-council: stage SARIF'

  - task: PublishBuildArtifacts@1
    condition: and(always(), ne(variables['securityCouncilRunDir'], ''))
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs'
      ArtifactName: 'CodeAnalysisLogs'
    displayName: 'security-council: publish CodeAnalysisLogs'

  - bash: |
      EXTRA=""
      if [ "${POST_PR_THREAD}" = "True" ] || [ "${POST_PR_THREAD}" = "true" ]; then
        EXTRA="--post-pr-thread"
      fi
      python3 -P -m security_council.ci.azure_devops "$(securityCouncilRunDir)" ${EXTRA}
    condition: and(always(), ne(variables['securityCouncilRunDir'], ''))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      POST_PR_THREAD: ${{ parameters.postPrThread }}
    displayName: 'security-council: annotate (logissue, summary, PR thread)'

  - bash: exit "$(securityCouncilExit)"
    condition: always()
    displayName: 'security-council: gate'
